name: CI

on:
  workflow_dispatch:
  
  #push:
  #  branches: [ master ]
  #pull_request:
  #  branches: [ master ]

jobs:
  build:

    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v2

    #
    # Build Core
    #
        
      - name: Build x86
        run: msbuild /t:build MajorPrivacyCore.sln /p:Configuration="Release" /p:Platform=x86
        
      - name: Build ARM64
        run: msbuild /t:build MajorPrivacyCore.sln /p:Configuration="Release" /p:Platform=ARM64
        
      - name: Build ARM64EC
        run: msbuild /t:build MajorPrivacyCore.sln /p:Configuration="Release" /p:Platform=ARM64EC
        
      - name: Build x64
        run: msbuild /t:build MajorPrivacyCore.sln /p:Configuration="Release" /p:Platform=x64

    #
    # Prepare Qt Framework
    #

#      - name: Install Qt6 x64
#        uses: jurplel/install-qt-action@v4.3.0
#        with:
#      #    version: '6.2.4'
#          version: '${{ env.qt6_version }}'
#      #    dir: ..
#      #    arch:  ${{ matrix.qt-target }}
#          arch:  'win64_msvc2022_64'
#      #    tools: 'tools_qtcreator,4.14.0-0-202012170949,qt.tools.qtcreator'
#          tools: 'tools_opensslv3_x64'
#          cache: true

      - name: Install Qt6 x64
        run: Installer\install_qt.cmd x64

      - name: Installing Jom
      #  if: steps.cache-qt.outputs.cache-hit != 'true'
        run: Installer\install_jom.cmd
        
    #
    # Build GUI
    #

      - name: Build GUI x64
        run: .\qmake_gui.cmd x64

    #
    # Finish
    #

      - name: Add missing languages for Qt6 (issue 1528)
        run: Installer\fix_qt5_languages.cmd x64 build_qt6

      - name: Get openssl binaries
        run: Installer\get_openssl.cmd

      - name: Get 7z binaries
        run: Installer\get_7zip.cmd

      - name: Add Dependencies
        run: Installer\copy_build.cmd x64 build_qt6

      - name: Collect installer assets
        run: Installer\get_assets.cmd

      - name: Upload installer assets
        #if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Assets
          path: |
            Installer/Assets/*
          retention-days: 60

      - name: Upload Build
        uses: actions/upload-artifact@v4.4.3
        with:
          name: MajorPrivacy
          path: |
            Build/**/*.exe
            Build/**/*.dll
            Build/**/*.sys
            Build/**/*.pdb
            Build/**/*.7z
